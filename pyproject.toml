[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "markdownforge"
version = "0.1.0"
description = "Zero-dependency Markdown TOC generator, local link linter, and standalone HTML exporter CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anwin CM", email = "Anwincm8@gmail.com" }]
keywords = ["markdown", "documentation", "cli", "linter", "html-export", "devtools"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
markdownforge = "markdownforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
